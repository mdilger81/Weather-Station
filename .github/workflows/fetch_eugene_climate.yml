name: Fetch Eugene Climate Data

on:
  schedule:
    - cron: '15 14 * * *'  # runs daily at 7:15 AM Pacific (14:15 UTC)
  workflow_dispatch:  # allows manual trigger

# GitHub disables scheduled workflows in public repos after 60 days without a
# commit. The keepalive step below re-enables this workflow via the API on every
# run, which resets that timer — so the workflow stays on without junk commits.
permissions:
  contents: read
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Eugene climate data
        env:
          NOAA_TOKEN: ${{ secrets.NOAA_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python fetch_eugene_climate.py

      - name: Keep workflow alive
        if: always()  # reset the inactivity timer even if the NOAA fetch fails
        uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c  # v1.2.1
